{% extends "base.html" %}

{% block title %}Mesajlar — Instalaz{% endblock %}

{% block extra_head %}
<style>
    /* Sohbet ekranı yüksekliği — mobil bottom-nav (~64px) hesaba katılır */
    .dm-shell { height: calc(100vh - 6rem); }
    @media (min-width: 768px) { .dm-shell { height: calc(100vh - 9rem); } }

    .dm-scroll::-webkit-scrollbar { width: 8px; }
    .dm-scroll::-webkit-scrollbar-thumb {
        background: rgba(15,15,25,0.14); border-radius: 8px;
        border: 2px solid transparent; background-clip: padding-box;
    }
    .dark .dm-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); background-clip: padding-box; }

    /* Mesaj baloncukları */
    .bubble { word-wrap: break-word; word-break: break-word; }
    .bubble-mine {
        background: linear-gradient(135deg, #C13584, #E1306C);
        color: #fff;
        box-shadow: 0 6px 16px -6px rgba(225,48,108,0.55);
    }
    .bubble-theirs {
        background: rgba(255,255,255,0.78);
        backdrop-filter: blur(12px);
        color: #1A1A22;
        border: 1px solid rgba(255,255,255,0.6);
        box-shadow: 0 6px 18px -8px rgba(60,30,90,0.18);
    }
    .dark .bubble-theirs {
        background: rgba(255,255,255,0.07);
        color: #FAFAF7;
        border-color: rgba(255,255,255,0.10);
    }

    /* Thread satırları */
    .thread-row { transition: background .15s ease; }
    .thread-row:hover { background: rgba(15,15,25,0.04); }
    .dark .thread-row:hover { background: rgba(255,255,255,0.05); }
    .thread-row.is-active {
        background: linear-gradient(90deg, rgba(193,53,132,0.10), rgba(247,119,55,0.06));
    }

    .tab-btn { position: relative; transition: color .15s; }
    .tab-btn .tab-underline {
        position: absolute; left: 25%; right: 25%; bottom: -1px; height: 2px; border-radius: 2px;
        background: linear-gradient(90deg, #C13584, #F77737); opacity: 0; transition: opacity .15s;
    }
    .tab-btn.is-active { color: #1A1A22; }
    .dark .tab-btn.is-active { color: #FAFAF7; }
    .tab-btn.is-active .tab-underline { opacity: 1; }
</style>
{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-3 sm:px-4" x-data="messagesApp()" x-init="init()">
    <div class="dm-shell card-strong rounded-3xl overflow-hidden flex">

        <!-- Sol panel: Thread listesi -->
        <aside class="w-full sm:w-80 md:w-[22rem] border-r border-black/5 dark:border-white/5 flex flex-col"
               :class="{ 'hidden sm:flex': activeThreadId }">
            <header class="px-5 py-4 flex items-center justify-between gap-3">
                <div class="flex items-center gap-2 min-w-0">
                    <h2 class="font-display font-semibold text-lg truncate">@{{ session.username }}</h2>
                </div>
                <button @click="openNewChat()"
                        class="btn btn-ghost !p-2 !rounded-xl"
                        title="Yeni mesaj">
                    <i class="far fa-pen-to-square text-[15px]"></i>
                </button>
            </header>

            <div class="px-5 pb-3">
                <div class="text-[11px] uppercase tracking-[0.18em] text-ig-text-secondary font-semibold">
                    Mesajlar
                </div>
            </div>

            <!-- Tabs -->
            <div class="flex px-5 border-b border-black/5 dark:border-white/5 text-sm font-medium">
                <button @click="tab = 'inbox'"
                        :class="tab === 'inbox' ? 'is-active' : 'text-ig-text-secondary'"
                        class="tab-btn flex-1 pb-3">
                    Birincil
                    <span class="tab-underline"></span>
                </button>
                <button @click="tab = 'pending'"
                        :class="tab === 'pending' ? 'is-active' : 'text-ig-text-secondary'"
                        class="tab-btn flex-1 pb-3 relative">
                    İstekler
                    <span x-show="pending.length > 0"
                          class="ml-1.5 px-1.5 py-0.5 text-[10px] font-semibold rounded-full bg-ig-secondary text-white"
                          x-text="pending.length" x-cloak></span>
                    <span class="tab-underline"></span>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto dm-scroll">
                <template x-if="threadsError">
                    <div class="m-4 p-4 rounded-2xl border border-ig-error/30 bg-ig-error/5 text-sm">
                        <div class="flex items-start gap-2 mb-2">
                            <i class="fas fa-circle-exclamation text-ig-error mt-0.5"></i>
                            <div class="flex-1">
                                <div class="font-semibold text-ig-error mb-1">Sohbetler alınamadı</div>
                                <div class="whitespace-pre-line opacity-90" x-text="threadsError"></div>
                            </div>
                        </div>
                        <button @click="loadThreads()" class="mt-1 text-ig-link font-medium hover:underline">
                            <i class="fas fa-rotate-right mr-1"></i> Tekrar dene
                        </button>
                    </div>
                </template>

                <template x-if="!threadsError && loadingThreads && threads.length === 0">
                    <div class="p-8 text-center text-ig-text-secondary">
                        <div class="spinner mx-auto mb-3"></div>
                        Sohbetler yükleniyor…
                    </div>
                </template>

                <template x-if="!threadsError && !loadingThreads && currentList().length === 0">
                    <div class="p-10 text-center text-ig-text-secondary">
                        <div class="w-16 h-16 mx-auto mb-3 rounded-full ig-ring p-[2px]">
                            <div class="w-full h-full rounded-full bg-ig-bg dark:bg-ig-dark flex items-center justify-center">
                                <i class="far fa-paper-plane text-xl"></i>
                            </div>
                        </div>
                        <p class="font-display font-medium text-base text-ig-text dark:text-ig-light"
                           x-text="tab === 'pending' ? 'Bekleyen istek yok.' : 'Henüz bir sohbetin yok.'"></p>
                        <p class="text-sm mt-1">İlk mesajını gönderelim mi?</p>
                        <button @click="openNewChat()" class="btn btn-primary mt-4">
                            <i class="far fa-pen-to-square"></i> Mesaj başlat
                        </button>
                    </div>
                </template>

                <template x-for="t in currentList()" :key="t.id">
                    <button @click="openThread(t.id)"
                            class="thread-row w-full text-left flex items-center gap-3 px-5 py-3"
                            :class="{ 'is-active': activeThreadId === t.id }">
                        <div class="relative shrink-0">
                            <span class="block p-[2px] rounded-full" :class="t.unread ? 'ig-ring' : 'bg-black/10 dark:bg-white/10'">
                                <img :src="proxyUrl(t.avatar) || '/static/default-avatar.png'"
                                     alt="" class="w-12 h-12 rounded-full object-cover bg-ig-bg dark:bg-ig-dark"
                                     onerror="this.src='/static/default-avatar.png'">
                            </span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between gap-2">
                                <span class="font-semibold truncate text-[15px]" x-text="t.title"></span>
                                <span class="text-[11px] text-ig-text-secondary shrink-0"
                                      x-text="formatRelativeTime(t.last_activity_at)"></span>
                            </div>
                            <div class="text-[13px] truncate"
                                 :class="t.unread ? 'text-ig-text dark:text-ig-light font-semibold' : 'text-ig-text-secondary'">
                                <span x-show="t.last_message && t.last_message.is_sent_by_viewer" class="text-ig-text-secondary">Sen: </span>
                                <span x-text="t.last_message ? t.last_message.preview : 'Henüz mesaj yok'"></span>
                            </div>
                        </div>
                        <span x-show="t.unread" class="w-2.5 h-2.5 bg-ig-link rounded-full shrink-0" x-cloak></span>
                    </button>
                </template>
            </div>
        </aside>

        <!-- Sağ panel: Konuşma -->
        <section class="flex-1 flex flex-col min-w-0" :class="{ 'hidden sm:flex': !activeThreadId }">
            <template x-if="!activeThreadId">
                <div class="flex-1 flex flex-col items-center justify-center text-center p-8">
                    <div class="w-28 h-28 rounded-full ig-ring p-[3px] mb-5">
                        <div class="w-full h-full rounded-full bg-ig-bg dark:bg-ig-dark flex items-center justify-center">
                            <i class="far fa-paper-plane text-4xl text-ig-text-secondary"></i>
                        </div>
                    </div>
                    <h3 class="font-display text-2xl font-semibold mb-1">Mesajların</h3>
                    <p class="text-ig-text-secondary mb-5 max-w-sm">
                        Bir kullanıcıya doğrudan mesaj gönder, fotoğraf veya video paylaş. Mevcut sohbetlerin sol tarafta görünür.
                    </p>
                    <button @click="openNewChat()" class="btn btn-primary">
                        <i class="far fa-pen-to-square"></i> Mesaj gönder
                    </button>
                </div>
            </template>

            <template x-if="activeThreadId">
                <div class="flex-1 flex flex-col min-h-0">
                    <!-- Conversation header -->
                    <header class="px-4 py-3 border-b border-black/5 dark:border-white/5 flex items-center gap-3">
                        <button @click="closeThread()" class="sm:hidden btn btn-ghost !p-2 !rounded-xl">
                            <i class="fas fa-arrow-left"></i>
                        </button>
                        <span class="block p-[2px] rounded-full ig-ring shrink-0">
                            <img :src="proxyUrl(activeThread()?.avatar) || '/static/default-avatar.png'"
                                 alt="" class="w-10 h-10 rounded-full object-cover bg-ig-bg dark:bg-ig-dark"
                                 onerror="this.src='/static/default-avatar.png'">
                        </span>
                        <div class="flex-1 min-w-0">
                            <div class="font-semibold text-[15px] truncate" x-text="activeThread()?.title || 'Sohbet'"></div>
                            <div class="text-xs text-ig-text-secondary truncate"
                                 x-text="(activeThread()?.users || []).map(u => '@' + u.username).join(', ')"></div>
                        </div>
                        <button @click="loadActiveThread(true)" class="btn btn-ghost !p-2 !rounded-xl" title="Yenile">
                            <i class="fas fa-arrows-rotate" :class="{ 'animate-spin': loadingMessages }"></i>
                        </button>
                    </header>

                    <!-- Messages -->
                    <div class="flex-1 overflow-y-auto dm-scroll px-4 py-5 space-y-3"
                         x-ref="messagesContainer">
                        <template x-if="messagesError">
                            <div class="p-4 rounded-2xl border border-ig-error/30 bg-ig-error/5 text-sm">
                                <div class="flex items-start gap-2 mb-2">
                                    <i class="fas fa-circle-exclamation text-ig-error mt-0.5"></i>
                                    <div class="flex-1">
                                        <div class="font-semibold text-ig-error mb-1">Mesajlar yüklenemedi</div>
                                        <div class="whitespace-pre-line opacity-90" x-text="messagesError"></div>
                                    </div>
                                </div>
                                <button @click="loadActiveThread(true)" class="mt-1 text-ig-link font-medium hover:underline">
                                    <i class="fas fa-rotate-right mr-1"></i> Tekrar dene
                                </button>
                            </div>
                        </template>

                        <template x-if="!messagesError && loadingMessages && messages.length === 0">
                            <div class="text-center py-10"><div class="spinner mx-auto"></div></div>
                        </template>

                        <template x-for="(m, idx) in messages" :key="m.id || idx">
                            <div class="flex" :class="m.is_sent_by_viewer ? 'justify-end' : 'justify-start'">
                                <div class="max-w-[78%] sm:max-w-md">
                                    <!-- Text / link with text -->
                                    <template x-if="m.item_type === 'text' || (m.item_type === 'link' && m.text)">
                                        <div class="bubble px-4 py-2 rounded-2xl text-[15px] leading-snug"
                                             :class="m.is_sent_by_viewer ? 'bubble-mine rounded-br-md' : 'bubble-theirs rounded-bl-md'">
                                            <p class="whitespace-pre-wrap" x-text="m.text"></p>
                                        </div>
                                    </template>

                                    <!-- Image -->
                                    <template x-if="m.media && m.media.kind === 'image'">
                                        <div class="rounded-2xl overflow-hidden bg-black/5 dark:bg-white/5">
                                            <img :src="proxyUrl(m.media.thumbnail_url)"
                                                 class="max-w-full max-h-96 object-cover cursor-zoom-in"
                                                 @click="openLightbox(proxyUrl(m.media.thumbnail_url))">
                                        </div>
                                    </template>

                                    <!-- Video -->
                                    <template x-if="m.media && m.media.kind === 'video'">
                                        <div class="rounded-2xl overflow-hidden bg-black">
                                            <video :src="proxyUrl(m.media.video_url)"
                                                   :poster="proxyUrl(m.media.thumbnail_url)"
                                                   controls preload="metadata"
                                                   class="max-w-full max-h-96"></video>
                                        </div>
                                    </template>

                                    <!-- Voice -->
                                    <template x-if="m.media && m.media.kind === 'audio'">
                                        <div class="card-tight px-3 py-2 flex items-center gap-3">
                                            <span class="w-8 h-8 rounded-full ig-gradient flex items-center justify-center text-white">
                                                <i class="fas fa-microphone text-xs"></i>
                                            </span>
                                            <audio :src="proxyUrl(m.media.audio_url)" controls preload="metadata" class="h-8"></audio>
                                        </div>
                                    </template>

                                    <!-- Post / Reel reshare -->
                                    <template x-if="m.media && (m.media.kind === 'media_share' || m.media.kind === 'xma_share')">
                                        <a :href="m.media.target_url || '#'" target="_blank" rel="noopener"
                                           class="block rounded-2xl overflow-hidden card-tight">
                                            <template x-if="m.media.thumbnail_url || m.media.video_url">
                                                <img :src="proxyUrl(m.media.thumbnail_url || m.media.video_url)"
                                                     class="w-64 h-64 object-cover">
                                            </template>
                                            <div class="p-3 text-[13px]">
                                                <div class="font-semibold truncate"
                                                     x-text="m.media.title || (m.media.owner_username ? '@' + m.media.owner_username : 'Paylaşılan içerik')"></div>
                                                <div class="text-ig-text-secondary text-xs">Instagram'da görüntüle</div>
                                            </div>
                                        </a>
                                    </template>

                                    <!-- Link preview -->
                                    <template x-if="m.media && m.media.kind === 'link'">
                                        <a :href="m.media.link_url" target="_blank" rel="noopener"
                                           class="block rounded-2xl overflow-hidden card-tight p-3">
                                            <div class="text-[13px] font-semibold truncate" x-text="m.media.link_title || m.media.link_url"></div>
                                            <div class="text-xs text-ig-text-secondary truncate" x-text="m.media.link_summary || m.media.link_url"></div>
                                        </a>
                                    </template>

                                    <!-- Unknown type fallback -->
                                    <template x-if="!m.media && m.item_type !== 'text' && m.item_type !== 'link'">
                                        <div class="bubble bubble-theirs rounded-bl-md px-4 py-2 italic text-sm">
                                            [<span x-text="m.item_type || 'desteklenmeyen mesaj'"></span>]
                                        </div>
                                    </template>

                                    <div class="text-[10px] text-ig-text-secondary mt-1 px-1"
                                         :class="m.is_sent_by_viewer ? 'text-right' : 'text-left'"
                                         x-text="formatRelativeTime(m.timestamp)"></div>
                                </div>
                            </div>
                        </template>

                        <div x-show="messages.length === 0 && !loadingMessages && !messagesError"
                             class="text-center text-ig-text-secondary py-12 text-sm">
                            Bu sohbette henüz mesaj yok. İlk mesajı sen gönder!
                        </div>
                    </div>

                    <!-- Composer -->
                    <footer class="border-t border-black/5 dark:border-white/5 px-3 py-3">
                        <template x-if="pendingMedia">
                            <div class="mb-2 flex items-center justify-between gap-2 card-tight px-3 py-2 text-sm">
                                <div class="flex items-center gap-2 min-w-0">
                                    <i class="fas" :class="pendingMedia.kind === 'video' ? 'fa-film' : 'fa-image'"></i>
                                    <span class="truncate" x-text="pendingMedia.name"></span>
                                    <span class="text-xs text-ig-text-secondary" x-text="formatFileSize(pendingMedia.size)"></span>
                                </div>
                                <button @click="clearPendingMedia()" class="text-ig-error hover:scale-110 transition-transform">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </template>

                        <form @submit.prevent="sendMessage()"
                              class="flex items-end gap-2 glass-input rounded-2xl px-2 py-1.5">
                            <label class="cursor-pointer p-2 text-ig-text-secondary hover:text-ig-secondary transition-colors"
                                   title="Fotoğraf/Video">
                                <i class="far fa-image text-[18px]"></i>
                                <input type="file" class="hidden" accept="image/*,video/*" @change="onPickMedia($event)">
                            </label>

                            <textarea x-model="composer" rows="1"
                                      @keydown.enter.prevent="if(!$event.shiftKey){ sendMessage() } else { composer += '\n' }"
                                      placeholder="Mesaj yaz…"
                                      class="flex-1 bg-transparent outline-none resize-none py-2 text-[15px] placeholder:text-ig-text-secondary"
                                      style="min-height: 40px; max-height: 140px;"></textarea>

                            <button type="submit" :disabled="sending || (!composer.trim() && !pendingMedia)"
                                    class="btn btn-primary !p-2.5 !rounded-xl disabled:opacity-40 disabled:cursor-not-allowed">
                                <i class="fas" :class="sending ? 'fa-circle-notch fa-spin' : 'fa-paper-plane'"></i>
                            </button>
                        </form>
                    </footer>
                </div>
            </template>
        </section>
    </div>

    <!-- New Chat modal -->
    <div x-show="newChatOpen" x-cloak
         class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4"
         @click.self="closeNewChat()">
        <div class="card-strong rounded-3xl w-full max-w-md overflow-hidden">
            <header class="flex items-center justify-between px-5 py-4 border-b border-black/5 dark:border-white/5">
                <h3 class="font-display font-semibold text-lg">Yeni mesaj</h3>
                <button @click="closeNewChat()" class="btn btn-ghost !p-2 !rounded-xl">
                    <i class="fas fa-times"></i>
                </button>
            </header>

            <div class="p-5 space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-ig-text-secondary mb-2">Kime</label>
                    <div class="flex flex-wrap gap-2 mb-2" x-show="newChatRecipients.length > 0">
                        <template x-for="u in newChatRecipients" :key="u.pk">
                            <span class="pill pill-grad">
                                <span x-text="'@' + u.username"></span>
                                <button @click="removeRecipient(u)" class="hover:scale-110">
                                    <i class="fas fa-times text-[10px]"></i>
                                </button>
                            </span>
                        </template>
                    </div>
                    <input type="text" class="ig-input"
                           x-model="newChatQuery"
                           @input.debounce.300ms="searchUsers()"
                           placeholder="Kullanıcı adı ile ara…">
                </div>

                <div class="max-h-56 overflow-y-auto dm-scroll rounded-2xl border border-black/5 dark:border-white/5"
                     x-show="newChatResults.length > 0 || searchingUsers">
                    <template x-if="searchingUsers">
                        <div class="text-center text-ig-text-secondary py-4 text-sm">Aranıyor…</div>
                    </template>
                    <template x-for="u in newChatResults" :key="u.pk">
                        <button @click="addRecipient(u)"
                                class="w-full text-left flex items-center gap-3 px-3 py-2.5 hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
                            <span class="block p-[2px] rounded-full ig-ring shrink-0">
                                <img :src="proxyUrl(u.profile_pic_url) || '/static/default-avatar.png'"
                                     class="w-10 h-10 rounded-full object-cover bg-ig-bg dark:bg-ig-dark"
                                     onerror="this.src='/static/default-avatar.png'">
                            </span>
                            <div class="flex-1 min-w-0">
                                <div class="font-semibold text-sm truncate flex items-center gap-1">
                                    <span x-text="'@' + u.username"></span>
                                    <i x-show="u.is_verified" class="fas fa-circle-check text-ig-link text-xs"></i>
                                </div>
                                <div class="text-xs text-ig-text-secondary truncate" x-text="u.full_name"></div>
                            </div>
                        </button>
                    </template>
                </div>

                <textarea x-model="newChatText" rows="3"
                          placeholder="Mesajını yaz…"
                          class="ig-input resize-none"></textarea>

                <div class="flex items-center justify-between gap-2">
                    <label class="cursor-pointer text-sm text-ig-text-secondary hover:text-ig-secondary flex items-center gap-1.5 transition-colors">
                        <i class="fas fa-paperclip"></i>
                        <span class="truncate" x-text="newChatMedia ? newChatMedia.name : 'Medya ekle'"></span>
                        <input type="file" class="hidden" accept="image/*,video/*" @change="onPickNewChatMedia($event)">
                    </label>
                    <button @click="startNewChat()"
                            :disabled="startingChat || newChatRecipients.length === 0 || (!newChatText.trim() && !newChatMedia)"
                            class="btn btn-primary disabled:opacity-40 disabled:cursor-not-allowed">
                        <i class="fas" :class="startingChat ? 'fa-circle-notch fa-spin' : 'fa-paper-plane'"></i>
                        Gönder
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div x-show="lightboxUrl" x-cloak
         class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex items-center justify-center p-4"
         @click="lightboxUrl = null">
        <img :src="lightboxUrl" class="max-w-full max-h-full object-contain rounded-2xl">
    </div>
</div>

<script>
function messagesApp() {
    return {
        threads: [],
        pending: [],
        tab: 'inbox',
        loadingThreads: false,
        threadsError: null,
        activeThreadId: null,
        messages: [],
        messagesError: null,
        loadingMessages: false,
        composer: '',
        sending: false,
        pendingMedia: null,
        threadPollTimer: null,
        messagePollTimer: null,

        newChatOpen: false,
        newChatQuery: '',
        newChatResults: [],
        newChatRecipients: [],
        newChatText: '',
        newChatMedia: null,
        searchingUsers: false,
        startingChat: false,

        lightboxUrl: null,

        init() {
            this.loadThreads();
            this.threadPollTimer = setInterval(() => this.loadThreads(true), 15000);
            window.addEventListener('beforeunload', () => this.cleanup());
        },

        cleanup() {
            if (this.threadPollTimer) clearInterval(this.threadPollTimer);
            if (this.messagePollTimer) clearInterval(this.messagePollTimer);
        },

        currentList() { return this.tab === 'pending' ? this.pending : this.threads; },

        proxyUrl(url) {
            if (!url) return '';
            if (url.startsWith('/')) return url;
            return '/api/dm/media-proxy?url=' + encodeURIComponent(url);
        },

        formatRelativeTime(iso) {
            if (!iso) return '';
            const t = new Date(iso);
            const diff = (Date.now() - t.getTime()) / 1000;
            if (diff < 60) return 'şimdi';
            if (diff < 3600) return Math.floor(diff/60) + 'd';
            if (diff < 86400) return Math.floor(diff/3600) + 's';
            if (diff < 7*86400) return Math.floor(diff/86400) + 'g';
            return t.toLocaleDateString('tr-TR');
        },

        async loadThreads(silent = false) {
            if (!silent) this.loadingThreads = true;
            try {
                const r = await fetch('/api/dm/threads');
                if (r.status === 401) { window.location.href = '/login'; return; }
                let data = null;
                try { data = await r.json(); } catch (_) {}

                if (data && data.success) {
                    this.threads = data.threads || [];
                    this.pending = data.pending || [];
                    this.threadsError = null;
                } else {
                    const msg = (data && data.message) || `Sohbetler alınamadı (HTTP ${r.status}).`;
                    this.threadsError = msg;
                    if (this.threadPollTimer) {
                        clearInterval(this.threadPollTimer);
                        this.threadPollTimer = null;
                    }
                    if (!silent) showToast(msg, 'error');
                }
            } catch (e) {
                this.threadsError = 'Sunucuya bağlanılamadı.';
                if (!silent) showToast('Bağlantı hatası', 'error');
            } finally {
                this.loadingThreads = false;
            }
        },

        activeThread() {
            return this.threads.find(t => t.id === this.activeThreadId)
                || this.pending.find(t => t.id === this.activeThreadId);
        },

        async openThread(id) {
            this.activeThreadId = id;
            this.messages = [];
            await this.loadActiveThread();
            fetch(`/api/dm/threads/${id}/seen`, { method: 'POST' }).catch(() => {});
            const t = this.activeThread();
            if (t) t.unread = false;
            if (this.messagePollTimer) clearInterval(this.messagePollTimer);
            this.messagePollTimer = setInterval(() => this.pollMessages(), 5000);
        },

        closeThread() {
            this.activeThreadId = null;
            this.messages = [];
            if (this.messagePollTimer) clearInterval(this.messagePollTimer);
        },

        async loadActiveThread(force = false) {
            if (!this.activeThreadId) return;
            this.loadingMessages = true;
            this.messagesError = null;
            try {
                const r = await fetch(`/api/dm/threads/${this.activeThreadId}`);
                let data = null;
                try { data = await r.json(); } catch (_) {}
                if (data && data.success) {
                    this.messages = (data.thread.messages || []).slice().reverse();
                    this.$nextTick(() => this.scrollToBottom());
                } else {
                    const msg = (data && data.message) || `Sohbet yüklenemedi (HTTP ${r.status}).`;
                    this.messagesError = msg;
                    if (this.messagePollTimer) {
                        clearInterval(this.messagePollTimer);
                        this.messagePollTimer = null;
                    }
                    showToast(msg, 'error');
                }
            } catch (e) {
                this.messagesError = 'Bağlantı hatası';
                showToast('Bağlantı hatası', 'error');
            } finally {
                this.loadingMessages = false;
            }
        },

        async pollMessages() {
            if (!this.activeThreadId) return;
            const lastId = this.messages.length ? this.messages[this.messages.length - 1].id : null;
            try {
                const url = `/api/dm/threads/${this.activeThreadId}/messages` +
                            (lastId ? `?after_id=${encodeURIComponent(lastId)}` : '');
                const r = await fetch(url);
                if (!r.ok) return;
                const data = await r.json();
                if (data.success && data.messages && data.messages.length) {
                    const newOnes = data.messages.slice().reverse();
                    this.messages.push(...newOnes);
                    this.$nextTick(() => this.scrollToBottom());
                }
            } catch (e) {}
        },

        scrollToBottom() {
            const el = this.$refs.messagesContainer;
            if (el) el.scrollTop = el.scrollHeight;
        },

        onPickMedia(e) {
            const f = e.target.files[0];
            if (!f) return;
            this.pendingMedia = {
                file: f, name: f.name, size: f.size,
                kind: f.type.startsWith('video/') ? 'video' : 'image',
            };
            e.target.value = '';
        },

        clearPendingMedia() { this.pendingMedia = null; },

        async sendMessage() {
            if (this.sending) return;
            const text = this.composer.trim();
            if (!text && !this.pendingMedia) return;
            this.sending = true;
            try {
                let r;
                if (this.pendingMedia) {
                    const fd = new FormData();
                    fd.append('file', this.pendingMedia.file);
                    if (text) fd.append('text', text);
                    r = await fetch(`/api/dm/threads/${this.activeThreadId}/upload`, { method: 'POST', body: fd });
                } else {
                    r = await fetch(`/api/dm/threads/${this.activeThreadId}/send`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text }),
                    });
                }
                const data = await r.json();
                if (data.success) {
                    this.composer = '';
                    this.pendingMedia = null;
                    if (data.message) this.messages.push(data.message);
                    this.$nextTick(() => this.scrollToBottom());
                    this.loadThreads(true);
                } else {
                    showToast(data.message || 'Gönderilemedi', 'error');
                }
            } catch (e) {
                showToast('Mesaj gönderilemedi', 'error');
            } finally {
                this.sending = false;
            }
        },

        openNewChat() {
            this.newChatOpen = true;
            this.newChatQuery = '';
            this.newChatResults = [];
            this.newChatRecipients = [];
            this.newChatText = '';
            this.newChatMedia = null;
        },
        closeNewChat() { this.newChatOpen = false; },

        async searchUsers() {
            const q = this.newChatQuery.trim();
            if (!q) { this.newChatResults = []; return; }
            this.searchingUsers = true;
            try {
                const r = await fetch('/api/dm/search?q=' + encodeURIComponent(q));
                const data = await r.json();
                if (data.success) this.newChatResults = data.users || [];
            } catch (e) {}
            finally { this.searchingUsers = false; }
        },

        addRecipient(u) {
            if (!this.newChatRecipients.find(r => r.pk === u.pk)) this.newChatRecipients.push(u);
            this.newChatQuery = '';
            this.newChatResults = [];
        },
        removeRecipient(u) {
            this.newChatRecipients = this.newChatRecipients.filter(r => r.pk !== u.pk);
        },

        onPickNewChatMedia(e) {
            const f = e.target.files[0];
            if (f) this.newChatMedia = f;
            e.target.value = '';
        },

        async startNewChat() {
            if (this.startingChat || this.newChatRecipients.length === 0) return;
            this.startingChat = true;
            try {
                const usernames = this.newChatRecipients.map(u => u.username).join(',');
                let r;
                if (this.newChatMedia) {
                    const fd = new FormData();
                    fd.append('usernames', usernames);
                    if (this.newChatText.trim()) fd.append('text', this.newChatText.trim());
                    fd.append('file', this.newChatMedia);
                    r = await fetch('/api/dm/new', { method: 'POST', body: fd });
                } else {
                    r = await fetch('/api/dm/new', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ usernames, text: this.newChatText.trim() }),
                    });
                }
                const data = await r.json();
                if (data.success) {
                    showToast('Mesaj gönderildi', 'success');
                    this.closeNewChat();
                    await this.loadThreads();
                    if (data.thread_id) this.openThread(data.thread_id);
                } else {
                    showToast(data.message || 'Sohbet başlatılamadı', 'error');
                }
            } catch (e) {
                showToast('Bağlantı hatası', 'error');
            } finally {
                this.startingChat = false;
            }
        },

        openLightbox(url) { this.lightboxUrl = url; },
    };
}
</script>
{% endblock %}
